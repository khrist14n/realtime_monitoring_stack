# Tox environments — run the same steps consistently across machines:
#   tox                      # unit tests with coverage
#   tox -e lint              # ruff lint + format check
#   tox -e validate          # generate + validate configs
#   tox -e integration       # smoke tests against a deployed stack
[tox]
envlist = test, lint, validate
isolated_build = true

[testenv]
extras = dev
commands = pytest {posargs}

[testenv:lint]
commands =
    ruff check .
    ruff format --check .

[testenv:validate]
commands =
    monitoring-stack config
    monitoring-stack validate

[testenv:integration]
commands = pytest -m integration {posargs}