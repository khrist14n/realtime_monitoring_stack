name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Unit tests + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest (with coverage gate)
        run: pytest

      - name: Generate and validate configs
        run: |
          monitoring-stack config
          monitoring-stack validate

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  promtool:
    name: PromQL / Alertmanager validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Generate configs
        run: monitoring-stack config

      - name: promtool + amtool checks (Docker)
        run: make promtool

  # Heavy job: deploys the real stack and runs the smoke tests against it.
  # Runs on pushes to main (and manual dispatch) to keep PR CI fast/cheap.
  deploy-integration:
    name: End-to-end deploy + integration smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Deploy stack (compose up + health checks)
        run: monitoring-stack deploy

      - name: Run integration smoke tests against the live stack
        run: MONITORING_STACK_INTEGRATION=1 pytest -m integration --no-cov